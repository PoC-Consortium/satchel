# Security audits — dependency advisories for the Rust crates and the UI.
#
# Runs on pull requests, weekly and on demand; findings fail the run.

name: Security

on:
  pull_request: {}
  push:
    branches: [master]
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit all Rust lockfiles
        shell: bash
        run: |
          status=0
          while IFS= read -r file; do
            cargo audit --file "$file" || status=1
          done < <(find . -name Cargo.lock -not -path '*/target/*' -not -path '*/node_modules/*')
          exit "$status"

  npm-audit:
    name: NPM audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satchel/ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Audit Satchel UI
        run: npm audit --audit-level=high
