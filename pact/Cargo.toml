[workspace]
resolver = "2"
members = ["libswap", "pactd", "pact-cli", "../vendor/electrum-btcx"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/PoC-Consortium/satchel"

[workspace.dependencies]
libswap = { path = "libswap" }

# The extracted btcx crates (github.com/PoC-Consortium/btcx): chain params +
# registry, wallet key derivation, seed-at-rest storage, the Electrum
# connection layer, and the BDK on-chain wallet. Pinned by rev — bump
# deliberately, never track a branch.
params-btcx = { git = "https://github.com/PoC-Consortium/btcx", rev = "7a6ec87fdd6c2aae5bb7db9f773d6ff7ca961247" }
keys-btcx = { git = "https://github.com/PoC-Consortium/btcx", rev = "7a6ec87fdd6c2aae5bb7db9f773d6ff7ca961247" }
seedstore = { git = "https://github.com/PoC-Consortium/btcx", rev = "7a6ec87fdd6c2aae5bb7db9f773d6ff7ca961247" }
electrum-btcx = { git = "https://github.com/PoC-Consortium/btcx", rev = "7a6ec87fdd6c2aae5bb7db9f773d6ff7ca961247" }
wallet-btcx = { git = "https://github.com/PoC-Consortium/btcx", rev = "7a6ec87fdd6c2aae5bb7db9f773d6ff7ca961247", features = ["swap-support"] }

# Bitcoin stack — versions must stay mutually compatible (all on bitcoin 0.32).
bitcoin = { version = "0.32.102", features = ["serde", "rand-std"] }
miniscript = "13.1.0"
# v2 adaptor swaps (pact-htlc-v2): MuSig2 + Schnorr adaptor signatures.
# NOTE: musig2 pulls secp256k1 0.31, *separate* from bitcoin 0.32's 0.29 —
# never mix the two types; convert at the boundary by bytes (spec/protocol-v2.md).
musig2 = { version = "0.4.1", features = ["rand"] }

tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
axum = "0.8.9"
# BDK and the pinned upstream wallet require a single SQLite 0.31 native link.
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
anyhow = "1.0.104"
thiserror = "2.0.20"
hex = "0.4.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"

[profile.release]
lto = true
overflow-checks = true

[patch."https://github.com/PoC-Consortium/btcx"]
electrum-btcx = { path = "../vendor/electrum-btcx" }
