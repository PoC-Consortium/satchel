[package]
name = "pact-nostr"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Map Pact wire envelopes <-> Nostr events: public offer adverts (kind 31510) and gift-wrapped relay messages (kind 1059). Pure mapping + crypto, no relay I/O. See spec/protocol.md §8.8."

[dependencies]
pact-proto = { path = "../pact-proto" }
nostr = { version = "0.45.5", features = ["os-rng"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
hex = "0.4.3"

[dev-dependencies]
# For building/signing Pact envelopes and sealing relay blobs in tests.
bitcoin = { version = "0.32.102", features = ["rand-std"] }
