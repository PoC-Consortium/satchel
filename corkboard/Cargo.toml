[package]
name = "corkboard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Corkboard — the PoCX trading noticeboard: signed offers and blind message relay. No matching, no execution, no custody, no fees, no accounts."

[dependencies]
pact-proto = { path = "../pact-proto" }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
hex = "0.4.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
bitcoin = "0.32.102"
