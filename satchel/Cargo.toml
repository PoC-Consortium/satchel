[package]
name = "satchel"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Satchel - desktop app for PoCX trading: launches and supervises pactd, then opens the Pact UI"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
# OS notifications for swap events (issue #55) — paired with the
# @tauri-apps/plugin-notification JS API in the UI.
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.4"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
dirs = "7.0.0"
anyhow = "1.0.104"
# Update-check (GitHub releases) — rustls so cross-compiling the release matrix
# doesn't drag in OpenSSL. json for the GitHub API response.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

