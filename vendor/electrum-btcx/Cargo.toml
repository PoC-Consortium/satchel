[package]
workspace = "../../pact"
name = "electrum-btcx"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/PoC-Consortium/btcx"

[dependencies]
params-btcx = { git = "https://github.com/PoC-Consortium/btcx", rev = "7a6ec87fdd6c2aae5bb7db9f773d6ff7ca961247" }
anyhow = "1.0.104"
bitcoin = { version = "0.32.102", features = ["serde", "rand-std"] }
bdk_wallet = { version = "2", features = ["rusqlite"] }
electrum-client = "0.25.0"
rustls = "0.23.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
hex = "0.4.3"

webpki-roots = "1.0.9"
x509-parser = { version = "0.18.1", features = ["verify"] }

[dev-dependencies]
rcgen = "0.14.10"
