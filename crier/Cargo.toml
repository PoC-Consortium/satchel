[package]
name = "crier"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only Discord bot announcing the Pact orderbook: watches public offer adverts (kind 31510) and revocations (kind 5) on Nostr, answers /book on demand, and cries top-of-book changes into a channel. Holds no funds, signs nothing."

# Standalone crate (like ../corkboard) — not part of the pact/ workspace.
[workspace]

[dependencies]
pact-nostr = { path = "../pact-nostr" }
pact-proto = { path = "../pact-proto" }
nostr-sdk = "0.45.3"
# Only to install a process-wide rustls CryptoProvider at startup (see main()):
# nostr-sdk → tokio-rustls pulls rustls 0.23, which refuses to auto-pick a
# provider when both aws-lc-rs and ring are linked, breaking all wss:// relays.
# Same footgun pactd hit (pactd/src/main.rs).
rustls = "0.23.44"
# Serenity 0.12 still pins an obsolete rustls/webpki for its gateway.
# Use platform certificate validation for Discord until that dependency moves.
poise = { version = "0.7.0", default-features = false, features = ["cache", "chrono", "handle_panics"] }
serenity = { version = "0.12.5", default-features = false, features = ["native_tls_backend"] }
# BTC/USD reference rate fetch (cash annotations), using current rustls.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Build/sign offer envelopes and events in tests, mirroring pact-nostr's tests.
nostr = "0.45.5"
bitcoin = "0.32.102"
